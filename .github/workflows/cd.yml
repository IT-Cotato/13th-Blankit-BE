name: Backend CD

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Firebase deployment configuration
        shell: bash
        env:
          FIREBASE_ENABLED: "true"
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -eu

          if [ -z "${FIREBASE_ENABLED:-}" ]; then
            echo "::error::FIREBASE_ENABLED is missing"
            exit 1
          fi
          case "$FIREBASE_ENABLED" in
            true|false) ;;
            *)
              echo "::error::FIREBASE_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac

          if [ "$FIREBASE_ENABLED" = "true" ]; then
            if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
              echo "::error::FIREBASE_PROJECT_ID is missing"
              exit 1
            fi
            if [ -z "${FIREBASE_SERVICE_ACCOUNT_BASE64:-}" ]; then
              echo "::error::FIREBASE_SERVICE_ACCOUNT_BASE64 is missing"
              exit 1
            fi

            FIREBASE_VALIDATION_FILE=$(mktemp)
            trap 'rm -f "$FIREBASE_VALIDATION_FILE"' EXIT
            if ! python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["FIREBASE_SERVICE_ACCOUNT_BASE64"], validate=True))' \
                > "$FIREBASE_VALIDATION_FILE" 2> /dev/null; then
              echo "::error::FIREBASE_SERVICE_ACCOUNT_BASE64 is not valid Base64"
              exit 1
            fi
            if ! python3 -m json.tool "$FIREBASE_VALIDATION_FILE" > /dev/null 2>&1; then
              echo "::error::Decoded Firebase service account is not valid JSON"
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ockk/blankit-be:latest
            ockk/blankit-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/blankit

      - name: Deploy to Azure server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER_PASSWORD: ${{ secrets.DB_USER_PASSWORD }}
          DB_URL: ${{ secrets.DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}

          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_ENABLED: "true"

          APP_IMAGE_TAG: ockk/blankit-be:${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DB_NAME,DB_USERNAME,DB_PASSWORD,DB_USER_PASSWORD,DB_URL,JWT_SECRET,JWT_ACCESS_TOKEN_EXPIRATION,JWT_REFRESH_TOKEN_EXPIRATION,FIREBASE_SERVICE_ACCOUNT_BASE64,FIREBASE_PROJECT_ID,FIREBASE_ENABLED,APP_IMAGE_TAG
          script: |
            set -eu
            cd ~/blankit
            umask 077

            if [ -z "${FIREBASE_ENABLED:-}" ]; then
              echo "FIREBASE_ENABLED is missing"
              exit 1
            fi
            case "$FIREBASE_ENABLED" in
              true|false) ;;
              *)
                echo "FIREBASE_ENABLED must be exactly true or false"
                exit 1
                ;;
            esac

            mkdir -p secrets
            chmod 700 secrets
            FIREBASE_CREDENTIALS_FILE=secrets/firebase-service-account.json

            if [ "$FIREBASE_ENABLED" = "true" ]; then
              if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
                echo "FIREBASE_PROJECT_ID is missing while Firebase is enabled"
                exit 1
              fi
              if [ -z "${FIREBASE_SERVICE_ACCOUNT_BASE64:-}" ]; then
                echo "FIREBASE_SERVICE_ACCOUNT_BASE64 is missing while Firebase is enabled"
                exit 1
              fi
              if ! command -v python3 > /dev/null 2>&1; then
                echo "python3 is required to validate the Firebase service account JSON"
                exit 1
              fi

              FIREBASE_CREDENTIALS_TMP="${FIREBASE_CREDENTIALS_FILE}.tmp"
              trap 'rm -f "$FIREBASE_CREDENTIALS_TMP"' EXIT
              if ! python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["FIREBASE_SERVICE_ACCOUNT_BASE64"], validate=True))' \
                  > "$FIREBASE_CREDENTIALS_TMP" 2> /dev/null; then
                echo "FIREBASE_SERVICE_ACCOUNT_BASE64 is not valid Base64"
                exit 1
              fi
              if ! python3 -m json.tool "$FIREBASE_CREDENTIALS_TMP" > /dev/null 2>&1; then
                echo "Decoded Firebase service account is not valid JSON"
                exit 1
              fi
              chmod 600 "$FIREBASE_CREDENTIALS_TMP"
              mv "$FIREBASE_CREDENTIALS_TMP" "$FIREBASE_CREDENTIALS_FILE"
              trap - EXIT
            elif [ ! -f "$FIREBASE_CREDENTIALS_FILE" ]; then
              printf '{}\n' > "$FIREBASE_CREDENTIALS_FILE"
            fi
            chmod 600 "$FIREBASE_CREDENTIALS_FILE"

            APP_RUNTIME_UID=$(id -u)
            APP_RUNTIME_GID=$(id -g)

            printf 'DB_NAME=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\nDB_USER_PASSWORD=%s\nDB_URL=%s\nJWT_SECRET=%s\nJWT_ACCESS_TOKEN_EXPIRATION=%s\nJWT_REFRESH_TOKEN_EXPIRATION=%s\nFIREBASE_ENABLED=%s\nFIREBASE_PROJECT_ID=%s\nGOOGLE_APPLICATION_CREDENTIALS=%s\nAPP_IMAGE_TAG=%s\nAPP_RUNTIME_UID=%s\nAPP_RUNTIME_GID=%s\n' \
              "$DB_NAME" "$DB_USERNAME" "$DB_PASSWORD" "$DB_USER_PASSWORD" "$DB_URL" "$JWT_SECRET" "${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}" "${JWT_REFRESH_TOKEN_EXPIRATION:-1209600000}" "$FIREBASE_ENABLED" "$FIREBASE_PROJECT_ID" "/run/secrets/firebase-service-account.json" "$APP_IMAGE_TAG" "$APP_RUNTIME_UID" "$APP_RUNTIME_GID" > .env
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' blankit-app 2>/dev/null)
              if [ "$STATUS" = "healthy" ]; then
                echo "App is healthy"
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "App is unhealthy"
                exit 1
              fi
              echo "Attempt $i/24: status=$STATUS, retrying in 10s..."
              sleep 10
            done
            echo "App failed to become healthy within 240s"
            exit 1
