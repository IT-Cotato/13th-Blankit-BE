server:
  forward-headers-strategy: framework

spring:
  application:
    name: blankit
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

blankit:
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
  push:
    scheduler:
      fixed-delay: ${PUSH_SCHEDULER_FIXED_DELAY:60000}
      processing-lease-millis: ${PUSH_PROCESSING_LEASE_MILLIS:300000}
    thirty-minute-pack:
      horizon-days: ${THIRTY_MIN_PACK_HORIZON_DAYS:14}
      refresh-cron: ${THIRTY_MIN_PACK_REFRESH_CRON:0 10 0 * * *}
      zone: ${THIRTY_MIN_PACK_ZONE:Asia/Seoul}
    task-deadline:
      deadline-time: ${TASK_DEADLINE_TIME:09:00}
      refresh-cron: ${TASK_DEADLINE_REFRESH_CRON:0 20 0 * * *}
      zone: ${TASK_DEADLINE_ZONE:Asia/Seoul}
  task:
    repeat-deadline:
      cron: ${REPEAT_DEADLINE_CRON:0 5 0 * * *}
      zone: ${REPEAT_DEADLINE_ZONE:Asia/Seoul}
