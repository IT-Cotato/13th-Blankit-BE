server:
  forward-headers-strategy: framework

spring:
  application:
    name: blankit
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081,https://13th-blankit-fe-git-develop-sumins-projects-d5fecc68.vercel.app}

blankit:
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
  push:
    scheduler:
      fixed-delay: ${PUSH_SCHEDULER_FIXED_DELAY:60000}
      processing-lease-millis: ${PUSH_PROCESSING_LEASE_MILLIS:300000}
      max-jobs-per-tick: ${PUSH_MAX_JOBS_PER_TICK:100}
      retry-delays: ${PUSH_RETRY_DELAYS:PT1M,PT5M,PT15M,PT1H}
    thirty-minute-pack:
      horizon-days: ${THIRTY_MIN_PACK_HORIZON_DAYS:14}
      refresh-cron: ${THIRTY_MIN_PACK_REFRESH_CRON:0 10 0 * * *}
    task-deadline:
      deadline-time: ${TASK_DEADLINE_TIME:09:00}
      refresh-cron: ${TASK_DEADLINE_REFRESH_CRON:0 20 0 * * *}
    routes:
      task-detail: ${PUSH_TASK_DETAIL_PATH:/tasks/{taskId}}
      thirty-minute-pack: ${PUSH_THIRTY_MIN_PACK_PATH:/recommendations/pack30?availableMinutes={minutes}}
  task:
    repeat-deadline:
      cron: ${REPEAT_DEADLINE_CRON:0 5 0 * * *}
