spring:
  datasource:
    url: jdbc:h2:mem:blankit-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

blankit:
  firebase:
    enabled: false
  push:
    scheduler:
      enabled: false

jwt:
  secret: blankit-test-secret-key-for-jwt-must-be-at-least-32-bytes
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000
